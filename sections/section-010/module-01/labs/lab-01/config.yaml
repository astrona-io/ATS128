# Connect A Gitea Repository To Pipelines-as-Code
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-128-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton-pac"
      description: "Installs the tkn CLI 0.46.2, tkn-pac 0.52.0, Tekton Pipelines v1.17.1 and Gitea with the user starfleet and a token (no Pipelines-as-Code)"
      type: "file"
      source: "bootstrap/01-install-tekton-pac.sh"
    - name: "ats-128-lab-010-01-setup"
      description: "Seeds starfleet/bridge-app with .tekton/pull-request.yaml and the branch feature-hello"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespaces starfleet and gitea, Gitea and the tester pod"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-environment"
      description: "Waits until Tekton, Pipelines-as-Code and Gitea are ready"
      type: "file"
      source: "testing/wait-for-environment.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-pac-installed"
      description: "Confirms Pipelines-as-Code v0.52.0 runs: controller, watcher and webhook"
      type: "file"
      source: "validation/validate-pac-installed.sh"
    - name: "validate-repository"
      description: "Confirms the Repository bridge-app in starfleet has the right URL, a working Gitea token and a webhook secret"
      type: "file"
      source: "validation/validate-repository.sh"
    - name: "validate-webhook"
      description: "Confirms an active Gitea webhook sends pull request events to the controller Service on port 8080"
      type: "file"
      source: "validation/validate-webhook.sh"
    - name: "validate-pull-request-run"
      description: "Confirms a PipelineRun from .tekton ran for the head of the pull request from feature-hello and succeeded"
      type: "file"
      source: "validation/validate-pull-request-run.sh"
    - name: "validate-commit-status"
      description: "Confirms Gitea shows 'Pipelines as Code CI / pull-request' = success on that commit"
      type: "file"
      source: "validation/validate-commit-status.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
      - alpine/git:v2.52.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
