# Connect A Git Repository To Pipelines-as-Code (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-128-playground-010-01"
  docs:
    guide: "docs/overview.md"
bootstrap:
  init:
    - name: "prepare"
      description: "Install tkn 0.46.2, tkn-pac 0.52.0, Tekton Pipelines v1.17.1 and Gitea, and seed starfleet/bridge-app with .tekton/pull-request.yaml and the branch feature-hello. Pipelines-as-Code is not installed."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "The namespaces starfleet and gitea, Gitea and the tester pod."
      type: "file"
      source: "manifests/lab-start.yaml"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
      - alpine/git:v2.52.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
