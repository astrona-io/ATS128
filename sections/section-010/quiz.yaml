# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats128-010
course_id: ATS128
exam_code: TEKTON
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "Install Pipelines-as-Code And Connect A Repository"
questions:
  - id: ats128-010-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain where Pipelines-as-Code keeps its pipelines"
    source_readings:
      - sections/section-010/module-01/course-01-what-pipelines-as-code-is.md
    prompt: "Where does Pipelines-as-Code read the PipelineRun templates that it runs?"
    options:
      - id: a
        text: "From the `.tekton` folder at the top of the Git repository."
        explanation: "Correct. Each file in `.tekton` is a PipelineRun template."
      - id: b
        text: "From a ConfigMap in the namespace `pipelines-as-code`."
        explanation: "Not correct. The ConfigMap holds settings, not pipelines."
      - id: c
        text: "From a Secret next to the `Repository` object."
        explanation: "Not correct. The Secret holds the token and the webhook secret."
      - id: d
        text: "From the `.github/workflows` folder of the repository."
        explanation: "Not correct. That folder belongs to GitHub Actions."
    correct_option: a
    explanation: "Correct. Each file in `.tekton` is a PipelineRun template."

  - id: ats128-010-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the Pipelines-as-Code components"
    source_readings:
      - sections/section-010/module-01/course-01-what-pipelines-as-code-is.md
    prompt: "Which component reports the final result of a finished PipelineRun back to the Git provider?"
    options:
      - id: a
        text: "The pipelines-as-code-controller."
        explanation: "Not correct. The controller receives the webhook and creates the run. It writes the first pending status only."
      - id: b
        text: "The pipelines-as-code-watcher."
        explanation: "Correct. The watcher follows the runs and reports the final status."
      - id: c
        text: "The pipelines-as-code-webhook."
        explanation: "Not correct. That is the admission webhook that validates `Repository` objects."
      - id: d
        text: "The Tekton Pipelines controller."
        explanation: "Not correct. Tekton runs the PipelineRun but knows nothing about the Git provider."
    correct_option: b
    explanation: "Correct. The watcher follows the runs and reports the final status."

  - id: ats128-010-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Trace a Git event to a PipelineRun"
    source_readings:
      - sections/section-010/module-01/course-01-what-pipelines-as-code-is.md
    prompt: "What does the pipelines-as-code-controller do first when it receives a webhook?"
    options:
      - id: a
        text: "It deletes the old PipelineRuns of the repository."
        explanation: "Not correct. Cleanup is a later task of the watcher."
      - id: b
        text: "It starts the Tasks of the PipelineRun in a new pod."
        explanation: "Not correct. Tekton Pipelines starts the Tasks, not the controller."
      - id: c
        text: "It checks the signature and finds the matching `Repository` object."
        explanation: "Correct. It then reads `.tekton` through the provider's API."
      - id: d
        text: "It asks the developer to approve the run in the cluster."
        explanation: "Not correct. No approval is needed for an allowed sender."
    correct_option: c
    explanation: "Correct. It then reads `.tekton` through the provider's API."

  - id: ats128-010-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe the Repository object"
    source_readings:
      - sections/section-010/module-01/course-01-what-pipelines-as-code-is.md
    prompt: "A user creates a second `Repository` for a URL that already has one, in another namespace. What happens?"
    options:
      - id: a
        text: "Both objects work and each namespace gets its own run."
        explanation: "Not correct. Only one `Repository` may use a URL."
      - id: b
        text: "The newer object replaces the older one without a message."
        explanation: "Not correct. Nothing is replaced. The new object is refused."
      - id: c
        text: "The controller picks the object in the alphabetically first namespace."
        explanation: "Not correct. The controller is never given a choice, because the second object does not exist."
      - id: d
        text: "The admission webhook refuses it, because only one `Repository` may exist for a URL in the cluster."
        explanation: "Correct. This stops a user from taking over another team's repository."
    correct_option: d
    explanation: "Correct. This stops a user from taking over another team's repository."

  - id: ats128-010-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell a GitHub App from a GitHub webhook"
    source_readings:
      - sections/section-010/module-01/course-01-what-pipelines-as-code-is.md
    prompt: "Where does Pipelines-as-Code show the result of a run when GitHub is connected with a GitHub webhook and a personal access token, not an App?"
    options:
      - id: a
        text: "As a comment on the pull request."
        explanation: "Correct. Without an App there is no Checks API."
      - id: b
        text: "In the Checks tab of the pull request."
        explanation: "Not correct. Only a GitHub App uses the Checks API."
      - id: c
        text: "In the Actions tab of the repository."
        explanation: "Not correct. Pipelines-as-Code does not use GitHub Actions."
      - id: d
        text: "As a new issue in the repository."
        explanation: "Not correct. It never opens issues for results."
    correct_option: a
    explanation: "Correct. Without an App there is no Checks API."

  - id: ats128-010-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Install Pipelines-as-Code on Kubernetes"
    source_readings:
      - sections/section-010/module-01/course-02-install-pipelines-as-code.md
    prompt: "Which release file do you apply to install Pipelines-as-Code on a plain Kubernetes cluster such as `kind`?"
    options:
      - id: a
        text: "`release.yaml` of the pinned release."
        explanation: "Not correct. That file is for OpenShift."
      - id: b
        text: "`release.k8s.yaml` of the pinned release."
        explanation: "Correct. This file is for plain Kubernetes."
      - id: c
        text: "The `stable` branch link of the project."
        explanation: "Not correct. A moving link changes with every release. Pin a release asset."
      - id: d
        text: "The Helm chart of the Tekton Dashboard."
        explanation: "Not correct. The Dashboard is a different project."
    correct_option: b
    explanation: "Correct. This file is for plain Kubernetes."

  - id: ats128-010-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find the webhook target port"
    source_readings:
      - sections/section-010/module-01/course-02-install-pipelines-as-code.md
    prompt: "The controller container listens on port 8082. Which address must a Gitea webhook use from inside the cluster?"
    options:
      - id: a
        text: "`http://pipelines-as-code-controller.pipelines-as-code.svc.cluster.local:8082`"
        explanation: "Not correct. 8082 is the container port. The Service does not listen on it."
      - id: b
        text: "`http://pipelines-as-code-watcher.pipelines-as-code.svc.cluster.local:8080`"
        explanation: "Not correct. The watcher does not receive webhooks."
      - id: c
        text: "`http://pipelines-as-code-controller.pipelines-as-code.svc.cluster.local:8080`"
        explanation: "Correct. The Service publishes the controller on port 8080."
      - id: d
        text: "`http://pipelines-as-code-controller.pipelines-as-code.svc.cluster.local:9090`"
        explanation: "Not correct. 9090 is the metrics port."
    correct_option: c
    explanation: "Correct. The Service publishes the controller on port 8080."

  - id: ats128-010-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Read the installation settings"
    source_readings:
      - sections/section-010/module-01/course-02-install-pipelines-as-code.md
    prompt: "Which object holds the settings of the whole Pipelines-as-Code installation, such as `application-name`?"
    options:
      - id: a
        text: "The ConfigMap `pipelines-as-code-info`."
        explanation: "Not correct. That ConfigMap reports the installed version."
      - id: b
        text: "The Secret `pipelines-as-code-secret`."
        explanation: "Not correct. That Secret holds GitHub App credentials."
      - id: c
        text: "The `Repository` custom resource."
        explanation: "Not correct. A `Repository` configures one repository only."
      - id: d
        text: "The ConfigMap `pipelines-as-code` in the namespace `pipelines-as-code`."
        explanation: "Correct. The application name is the prefix of every commit status."
    correct_option: d
    explanation: "Correct. The application name is the prefix of every commit status."

  - id: ats128-010-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Connect a repository with a token and a webhook"
    source_readings:
      - sections/section-010/module-01/course-03-connect-a-repository.md
    prompt: "A Secret stores the token under the key `token`. What must the `Repository` contain so that Pipelines-as-Code reads it?"
    options:
      - id: a
        text: "`key: token` in `git_provider.secret`."
        explanation: "Correct. Without `key`, Pipelines-as-Code reads `provider.token`."
      - id: b
        text: "Nothing. The key `token` is found automatically."
        explanation: "Not correct. The default key is `provider.token`."
      - id: c
        text: "`token: true` in `spec.settings`."
        explanation: "Not correct. That field does not exist."
      - id: d
        text: "The Secret in the namespace `pipelines-as-code`."
        explanation: "Not correct. The Secret must sit in the namespace of the `Repository`."
    correct_option: a
    explanation: "Correct. Without `key`, Pipelines-as-Code reads `provider.token`."

  - id: ats128-010-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Troubleshoot a repository that starts no run"
    source_readings:
      - sections/section-010/module-01/course-03-connect-a-repository.md
    prompt: "A pull request starts no PipelineRun. The `Repository` URL uses `localhost`, but Gitea sends the in-cluster host name. Why does nothing run?"
    options:
      - id: a
        text: "Gitea refuses to send webhooks to a `Repository`."
        explanation: "Not correct. Gitea sends the webhook. The controller finds no match."
      - id: b
        text: "The controller compares the URL of the event with `spec.url`, and they differ, so no `Repository` matches."
        explanation: "Correct. The URL must be exactly the address that Gitea puts in its webhooks."
      - id: c
        text: "Tekton Pipelines rejects the name `localhost`."
        explanation: "Not correct. Tekton never sees the event."
      - id: d
        text: "The watcher deletes runs for unknown hosts."
        explanation: "Not correct. The run is never created."
    correct_option: b
    explanation: "Correct. The URL must be exactly the address that Gitea puts in its webhooks."

  - id: ats128-010-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the fields of a Repository spec"
    source_readings:
      - sections/section-010/module-02/course-01-the-repository-object.md
    prompt: "Which `Repository` field limits how many PipelineRuns of one repository run at the same time?"
    options:
      - id: a
        text: "`spec.settings.max_runs`"
        explanation: "Not correct. That field does not exist."
      - id: b
        text: "`spec.concurrency_limit`"
        explanation: "Correct. The rest of the runs wait in a queue."
      - id: c
        text: "`spec.params`"
        explanation: "Not correct. `params` defines custom variables."
      - id: d
        text: "`spec.incoming`"
        explanation: "Not correct. `incoming` configures incoming webhooks."
    correct_option: b
    explanation: "Correct. The rest of the runs wait in a queue."

  - id: ats128-010-q12
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain the namespace rule"
    source_readings:
      - sections/section-010/module-02/course-01-the-repository-object.md
    prompt: "In which namespace does Pipelines-as-Code create the PipelineRuns of an event?"
    options:
      - id: a
        text: "In `pipelines-as-code`, next to the controller."
        explanation: "Not correct. The controller does not run pipelines in its own namespace."
      - id: b
        text: "In `tekton-pipelines`."
        explanation: "Not correct. That namespace holds Tekton itself."
      - id: c
        text: "In the namespace of the `Repository` that matched the event."
        explanation: "Correct. Secrets and ServiceAccounts for the run belong there too."
      - id: d
        text: "In the namespace named in each `.tekton` file."
        explanation: "Not correct. The template does not choose the namespace."
    correct_option: c
    explanation: "Correct. Secrets and ServiceAccounts for the run belong there too."

  - id: ats128-010-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why a second Repository breaks matching"
    source_readings:
      - sections/section-010/module-02/course-01-the-repository-object.md
    prompt: "A repository suddenly starts no runs. `kubectl get repositories.pipelinesascode.tekton.dev -A` shows two objects with the same `url` in different namespaces. What is the effect?"
    options:
      - id: a
        text: "Both namespaces get a copy of every run."
        explanation: "Not correct. The controller does not create runs for two matches."
      - id: b
        text: "The newer object wins."
        explanation: "Not correct. Age does not decide."
      - id: c
        text: "The watcher deletes the older object."
        explanation: "Not correct. The watcher does not delete a `Repository`."
      - id: d
        text: "The controller finds two matches and cannot decide, so it runs nothing."
        explanation: "Correct. One URL must map to one `Repository`."
    correct_option: d
    explanation: "Correct. One URL must map to one `Repository`."

  - id: ats128-010-q14
    type: single_choice
    difficulty: beginner
    learning_objective: "Change the application name"
    source_readings:
      - sections/section-010/module-02/course-02-global-settings.md
    prompt: "Which key of the ConfigMap `pipelines-as-code` sets the first part of the commit status name?"
    options:
      - id: a
        text: "`application-name`"
        explanation: "Correct. The status context is the application name, a slash and the PipelineRun name."
      - id: b
        text: "`status-prefix`"
        explanation: "Not correct. That key does not exist."
      - id: c
        text: "`hub-url`"
        explanation: "Not correct. That key is the catalog address."
      - id: d
        text: "`default-max-keep-runs`"
        explanation: "Not correct. That key sets how many runs are kept."
    correct_option: a
    explanation: "Correct. The status context is the application name, a slash and the PipelineRun name."

  - id: ats128-010-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the effect of a ConfigMap change"
    source_readings:
      - sections/section-010/module-02/course-02-global-settings.md
    prompt: "You change `application-name` in the ConfigMap. What happens to commit statuses that were set before?"
    options:
      - id: a
        text: "They are renamed by the watcher."
        explanation: "Not correct. The watcher does not rewrite old statuses."
      - id: b
        text: "They keep the old name. Only new runs use the new one."
        explanation: "Correct. Gitea stores the status context as text."
      - id: c
        text: "They are deleted."
        explanation: "Not correct. Nothing removes them."
      - id: d
        text: "Every run is restarted."
        explanation: "Not correct. A change affects new events only."
    correct_option: b
    explanation: "Correct. Gitea stores the status context as text."

  - id: ats128-010-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Replace a token safely"
    source_readings:
      - sections/section-010/module-02/course-03-tokens-and-webhook-events.md
    prompt: "You rotate the provider token by creating the Secret again with only the key `provider.token`. What breaks?"
    options:
      - id: a
        text: "Nothing. The controller keeps the old webhook secret."
        explanation: "Not correct. The controller reads the Secret for each event."
      - id: b
        text: "The `Repository` is deleted."
        explanation: "Not correct. The object does not depend on the Secret's lifetime."
      - id: c
        text: "The webhook secret is gone, so webhook requests fail the signature check."
        explanation: "Correct. Write both keys again when you replace the Secret."
      - id: d
        text: "The CRD is removed."
        explanation: "Not correct. A Secret change does not touch the CRD."
    correct_option: c
    explanation: "Correct. Write both keys again when you replace the Secret."

  - id: ats128-010-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find the failing side from the controller log"
    source_readings:
      - sections/section-010/module-02/course-03-tokens-and-webhook-events.md
    prompt: "After a push the controller log has no line for your push. Where is the problem most likely?"
    options:
      - id: a
        text: "The token has too few rights."
        explanation: "Not correct. A token problem shows as a failed API call in the log."
      - id: b
        text: "`max-keep-runs` is too low."
        explanation: "Not correct. It acts after a run exists."
      - id: c
        text: "The template has a wrong `on-event`."
        explanation: "Not correct. The controller would log the event first."
      - id: d
        text: "The webhook request did not reach the controller: check the webhook URL, events and deliveries on the Git server."
        explanation: "Correct. Nothing in the cluster can log a request that never arrived."
    correct_option: d
    explanation: "Correct. Nothing in the cluster can log a request that never arrived."

  - id: ats128-010-q18
    type: single_choice
    difficulty: beginner
    learning_objective: "Set pipelinerun_provenance"
    source_readings:
      - sections/section-010/module-02/course-04-choose-where-definitions-come-from.md
    prompt: "Which value of `settings.pipelinerun_provenance` makes a pull request run the pipelines of the default branch?"
    options:
      - id: a
        text: "`default_branch`"
        explanation: "Correct. The changed file in the pull request is not used."
      - id: b
        text: "`source`"
        explanation: "Not correct. `source` reads the files from the commit of the event."
      - id: c
        text: "`main`"
        explanation: "Not correct. That is not a valid value."
      - id: d
        text: "`protected`"
        explanation: "Not correct. That is not a valid value."
    correct_option: a
    explanation: "Correct. The changed file in the pull request is not used."

  - id: ats128-010-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the risk of the source setting"
    source_readings:
      - sections/section-010/module-02/course-04-choose-where-definitions-come-from.md
    prompt: "With the default `source` setting, what can a collaborator do in their own pull request?"
    options:
      - id: a
        text: "Nothing. Templates are always read from the default branch."
        explanation: "Not correct. That is the `default_branch` setting."
      - id: b
        text: "Change a template in `.tekton`, and the pull request runs the changed version."
        explanation: "Correct. The pipeline runs with the Secrets and ServiceAccount of the namespace."
      - id: c
        text: "Change the `Repository` object."
        explanation: "Not correct. The object is in the cluster, not in Git."
      - id: d
        text: "Skip `/ok-to-test` for strangers."
        explanation: "Not correct. The gate for strangers is a separate rule."
    correct_option: b
    explanation: "Correct. The pipeline runs with the Secrets and ServiceAccount of the namespace."

  - id: ats128-010-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose default_branch for a repository that takes outside pull requests"
    source_readings:
      - sections/section-010/module-02/course-04-choose-where-definitions-come-from.md
    prompt: "A team switches a repository to `default_branch`. A developer opens a pull request that adds a new template. What happens?"
    options:
      - id: a
        text: "The template runs, because pull requests always use their own files."
        explanation: "Not correct. That is the `source` setting."
      - id: b
        text: "The controller rejects the pull request."
        explanation: "Not correct. The pull request is tested with the pipelines of the default branch."
      - id: c
        text: "The new template does not run in the pull request, because it is not on the default branch yet."
        explanation: "Correct. A new pipeline takes effect after the merge."
      - id: d
        text: "The template runs on the next push to any branch."
        explanation: "Not correct. Only the default branch counts."
    correct_option: c
    explanation: "Correct. A new pipeline takes effect after the merge."
