# Repair A Broken Repository Connection (section 010 capstone)
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-128-capstone-010"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton-pac"
      description: "Installs the tkn CLI 0.46.2, tkn-pac 0.52.0, Tekton Pipelines v1.17.1, Pipelines-as-Code v0.52.0 and Gitea with the user starfleet and a token"
      type: "file"
      source: "bootstrap/01-install-tekton-pac.sh"
    - name: "ats-128-capstone-010-setup"
      description: "Seeds starfleet/bridge-app, an old Repository in default, a Secret with a misnamed token key, a webhook on the wrong port, and pull request #1"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespaces starfleet and gitea, Gitea and the tester pod"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-environment"
      description: "Waits until Tekton, Pipelines-as-Code and Gitea are ready"
      type: "file"
      source: "testing/wait-for-environment.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-repository"
      description: "Confirms the only Repository for the URL is bridge-app in starfleet, with a working token and a webhook secret"
      type: "file"
      source: "validation/validate-repository.sh"
    - name: "validate-webhook"
      description: "Confirms the Gitea webhook targets the controller Service on port 8080"
      type: "file"
      source: "validation/validate-webhook.sh"
    - name: "validate-pull-request-run"
      description: "Confirms a PipelineRun in starfleet tested the head of pull request #1 and succeeded"
      type: "file"
      source: "validation/validate-pull-request-run.sh"
    - name: "validate-commit-status"
      description: "Confirms Gitea shows 'Pipelines as Code CI / pull-request' = success on that commit"
      type: "file"
      source: "validation/validate-commit-status.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
      - alpine/git:v2.52.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
