# Route Push Pipelines By Branch (section 020 capstone)
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-128-capstone-020"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton-pac"
      description: "Installs the tkn CLI 0.46.2, tkn-pac 0.52.0, Tekton Pipelines v1.17.1, Pipelines-as-Code v0.52.0 and Gitea with the user starfleet and a token"
      type: "file"
      source: "bootstrap/01-install-tekton-pac.sh"
    - name: "ats-128-capstone-020-setup"
      description: "Seeds starfleet/bridge-app with a faulty push pipeline and a duplicate, the branches release-1.0 and feature-engines, and connects it"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespaces starfleet and gitea, Gitea and the tester pod"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-environment"
      description: "Waits until Tekton, Pipelines-as-Code and Gitea are ready"
      type: "file"
      source: "testing/wait-for-environment.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-tekton-folder"
      description: "Confirms .tekton on main has unique names and push keeps three runs"
      type: "file"
      source: "validation/validate-tekton-folder.sh"
    - name: "validate-push-routing"
      description: "Commits to feature-engines, main and release-1.0 and confirms push runs only for main and release-1.0"
      type: "file"
      source: "validation/validate-push-routing.sh"
    - name: "validate-push-cleanup"
      description: "Confirms at most three runs of push are kept after at least four pushes"
      type: "file"
      source: "validation/validate-push-cleanup.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
      - alpine/git:v2.52.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
