# The Repository bridge-app with two custom parameters. Pipelines-as-Code
# replaces {{ deploy_target }} and {{ log_level }} in the templates with these
# values before it creates the PipelineRun.
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: bridge-app
  namespace: starfleet
spec:
  url: "http://gitea-http.gitea.svc.cluster.local:3000/starfleet/bridge-app"
  git_provider:
    type: gitea
    url: "http://gitea-http.gitea.svc.cluster.local:3000"
    secret:
      name: gitea-webhook-config
      key: provider.token
    webhook_secret:
      name: gitea-webhook-config
      key: webhook.secret
  params:
    - name: deploy_target
      value: shuttle-bay
    - name: log_level
      value: debug
