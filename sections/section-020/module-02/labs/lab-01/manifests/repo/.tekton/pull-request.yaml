# Pipelines-as-Code runs this PipelineRun for every pull request into main.
# The values of the parameters below are dynamic variables (source_url and
# revision): Pipelines-as-Code replaces them with the pull request's repository URL and commit SHA.
# deploy_target and log_level are custom parameters: the values come from the
# params list of the Repository.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: pull-request
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  params:
    - name: repo_url
      value: "{{ source_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: deploy_target
      value: "{{ deploy_target }}"
    - name: log_level
      value: "{{ log_level }}"
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
      - name: deploy_target
        type: string
      - name: log_level
        type: string
    results:
      - name: commit
        value: $(tasks.checkout-and-test.results.commit)
    tasks:
      - name: checkout-and-test
        params:
          - name: repo_url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
          - name: deploy_target
            value: $(params.deploy_target)
          - name: log_level
            value: $(params.log_level)
        taskSpec:
          params:
            - name: repo_url
              type: string
            - name: revision
              type: string
            - name: deploy_target
              type: string
            - name: log_level
              type: string
          results:
            - name: commit
              description: The commit SHA that was checked out
          steps:
            - name: clone
              image: alpine/git:v2.52.0
              workingDir: /workspace
              script: |
                #!/bin/sh
                set -eu
                # The workspace folder belongs to another user than this step, so git
                # must be told that the clone is safe to use.
                git config --global --add safe.directory /workspace/source
                git clone --quiet "$(params.repo_url)" source
                cd source
                git checkout --quiet "$(params.revision)"
                git rev-parse HEAD | tr -d '\n' > "$(results.commit.path)"
                echo "Checked out $(params.revision)"
            - name: test
              image: busybox:1.37.0
              workingDir: /workspace/source
              script: |
                #!/bin/sh
                set -eu
                sh app/status.sh
            - name: report
              image: busybox:1.37.0
              script: |
                #!/bin/sh
                set -eu
                echo "deploy_target=$(params.deploy_target) log_level=$(params.log_level)"
                # A value that still has the braces was never replaced by Pipelines-as-Code.
                case "$(params.deploy_target)$(params.log_level)" in
                  *'{{'*) echo "A custom parameter was not replaced."; exit 1 ;;
                esac
