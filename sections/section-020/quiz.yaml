# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats128-020
course_id: ATS128
exam_code: TEKTON
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-020
  title: "The .tekton Directory And Event Matching"
questions:
  - id: ats128-020-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain where the folder is read from"
    source_readings:
      - sections/section-020/module-01/course-01-the-tekton-directory.md
    prompt: "From which commit does the controller read `.tekton` for a pull request?"
    options:
      - id: a
        text: "The latest commit of `main`."
        explanation: "Not correct. That is the behavior only when `pipelinerun_provenance` is set to `default_branch`."
      - id: b
        text: "The head commit of the pull request's branch."
        explanation: "Correct. A change to `.tekton` in a pull request is tested by that pull request."
      - id: c
        text: "The first commit of the repository."
        explanation: "Not correct. The controller never reads old history for this."
      - id: d
        text: "The commit the cluster last deployed."
        explanation: "Not correct. Pipelines-as-Code does not track deployments."
    correct_option: b
    explanation: "Correct. A change to `.tekton` in a pull request is tested by that pull request."

  - id: ats128-020-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell the two kinds of variables apart"
    source_readings:
      - sections/section-020/module-01/course-01-the-tekton-directory.md
    prompt: "Which statement about `{{ revision }}` and `$(params.revision)` is correct?"
    options:
      - id: a
        text: "Tekton fills both at the same time, when the run starts."
        explanation: "Not correct. Tekton does not know the `{{ }}` syntax."
      - id: b
        text: "Pipelines-as-Code fills both, before the run exists."
        explanation: "Not correct. `$(params.x)` is a Tekton variable."
      - id: c
        text: "Pipelines-as-Code fills `{{ revision }}` before the PipelineRun exists. Tekton fills `$(params.revision)` when the run starts."
        explanation: "Correct. The PipelineRun object in the cluster contains no `{{ }}`."
      - id: d
        text: "They are two spellings of the same variable."
        explanation: "Not correct. They are replaced by different programs at different times."
    correct_option: c
    explanation: "Correct. The PipelineRun object in the cluster contains no `{{ }}`."

  - id: ats128-020-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the right source URL for forks"
    source_readings:
      - sections/section-020/module-01/course-01-the-tekton-directory.md
    prompt: "A pull request comes from a fork. Which variable gives the URL to clone so that the run gets the fork's commit?"
    options:
      - id: a
        text: "`{{ repo_url }}`"
        explanation: "Not correct. That is the repository that has the `Repository` object. It does not hold the fork's commit."
      - id: b
        text: "`{{ target_namespace }}`"
        explanation: "Not correct. That is a namespace, not a URL."
      - id: c
        text: "`{{ git_auth_secret }}`"
        explanation: "Not correct. That is the name of a Secret with the token."
      - id: d
        text: "`{{ source_url }}`"
        explanation: "Correct. It is the repository the change comes from."
    correct_option: d
    explanation: "Correct. It is the repository the change comes from."

  - id: ats128-020-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Use on-event and on-target-branch"
    source_readings:
      - sections/section-020/module-01/course-02-match-events-and-branches.md
    prompt: "A PipelineRun has `on-event: \"[pull_request]\"` and `on-target-branch: \"[main]\"`. For which pull requests does it run?"
    options:
      - id: a
        text: "Pull requests that merge into `main`."
        explanation: "Correct. For a pull request, the target branch is the branch it merges into."
      - id: b
        text: "Pull requests that come from the branch `main`."
        explanation: "Not correct. That would be the source branch."
      - id: c
        text: "Every push to `main`."
        explanation: "Not correct. A push is the event `push`, not `pull_request`."
      - id: d
        text: "Every pull request in the repository."
        explanation: "Not correct. The branch annotation limits it to `main`."
    correct_option: a
    explanation: "Correct. For a pull request, the target branch is the branch it merges into."

  - id: ats128-020-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Spot a wrong event name"
    source_readings:
      - sections/section-020/module-01/course-02-match-events-and-branches.md
    prompt: "A template says `on-event: \"[pull-request]\"`. What happens when a pull request is opened?"
    options:
      - id: a
        text: "The run starts, because dashes and underscores are the same."
        explanation: "Not correct. Event names are fixed words."
      - id: b
        text: "Nothing matches, and Pipelines-as-Code does not warn on the pull request."
        explanation: "Correct. The correct name has an underscore: `pull_request`."
      - id: c
        text: "The admission webhook refuses the pull request."
        explanation: "Not correct. The admission webhook checks `Repository` objects only."
      - id: d
        text: "The controller changes the name and starts the run."
        explanation: "Not correct. It does not correct names."
    correct_option: b
    explanation: "Correct. The correct name has an underscore: `pull_request`."

  - id: ats128-020-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write branch patterns"
    source_readings:
      - sections/section-020/module-01/course-02-match-events-and-branches.md
    prompt: "Which `on-target-branch` value matches `main`, `release-1.0` and `release-2.3`?"
    options:
      - id: a
        text: "`[main, release-.*]`"
        explanation: "Not correct. The patterns are globs, not regular expressions."
      - id: b
        text: "`[release-*]`"
        explanation: "Not correct. It does not match `main`."
      - id: c
        text: "`[main, release-*]`"
        explanation: "Correct. The pattern is a glob, and `*` matches any characters."
      - id: d
        text: "`[refs/tags/*]`"
        explanation: "Not correct. That matches tags, not branches."
    correct_option: c
    explanation: "Correct. The pattern is a glob, and `*` matches any characters."

  - id: ats128-020-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know when a pull request tests a changed template"
    source_readings:
      - sections/section-020/module-01/course-02-match-events-and-branches.md
    prompt: "You fix a broken `.tekton` file on `main`, but the open pull request still runs the old rule. Why?"
    options:
      - id: a
        text: "The controller caches the template for one hour."
        explanation: "Not correct. It reads the folder again for each event."
      - id: b
        text: "Pull requests use the `.tekton` folder of the oldest open branch."
        explanation: "Not correct. There is no such rule."
      - id: c
        text: "The watcher must restart first."
        explanation: "Not correct. The watcher does not read templates."
      - id: d
        text: "The pull request uses the `.tekton` folder of its own branch."
        explanation: "Correct. Change the file on that branch, or merge `main` into it."
    correct_option: d
    explanation: "Correct. Change the file on that branch, or merge `main` into it."

  - id: ats128-020-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use CEL expressions"
    source_readings:
      - sections/section-020/module-01/course-03-cel-paths-and-cleanup.md
    prompt: "A PipelineRun has a correct `on-target-branch` and a CEL expression that is false for the event. What happens?"
    options:
      - id: a
        text: "It does not run, because the CEL expression overrides the other matching annotations."
        explanation: "Correct. Keep one way of matching per PipelineRun."
      - id: b
        text: "It runs, because `on-target-branch` matches."
        explanation: "Not correct. The branch annotation is ignored when a CEL expression exists."
      - id: c
        text: "It runs only when both are true."
        explanation: "Not correct. They are not combined."
      - id: d
        text: "The admission webhook refuses the file."
        explanation: "Not correct. The webhook does not check templates."
    correct_option: a
    explanation: "Correct. Keep one way of matching per PipelineRun."

  - id: ats128-020-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Match changed paths"
    source_readings:
      - sections/section-020/module-01/course-03-cel-paths-and-cleanup.md
    prompt: "Which annotation runs a push PipelineRun only when a file under `app/` changed?"
    options:
      - id: a
        text: "`pipelinesascode.tekton.dev/on-label: \"[app]\"`"
        explanation: "Not correct. `on-label` matches pull request labels."
      - id: b
        text: "`pipelinesascode.tekton.dev/on-path-change: \"[app/**]\"`"
        explanation: "Correct. It works together with `on-event` and `on-target-branch`."
      - id: c
        text: "`pipelinesascode.tekton.dev/on-target-branch: \"[app/**]\"`"
        explanation: "Not correct. That matches branch names, not file paths."
      - id: d
        text: "`pipelinesascode.tekton.dev/max-keep-runs: \"app\"`"
        explanation: "Not correct. That sets how many runs to keep."
    correct_option: b
    explanation: "Correct. It works together with `on-event` and `on-target-branch`."

  - id: ats128-020-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Troubleshoot duplicate names"
    source_readings:
      - sections/section-020/module-01/course-03-cel-paths-and-cleanup.md
    prompt: "Two files in `.tekton` define PipelineRuns with the same `metadata.name`. What does Pipelines-as-Code run for the event?"
    options:
      - id: a
        text: "Only the first file in alphabetical order."
        explanation: "Not correct. It does not pick one."
      - id: b
        text: "Both files, with random suffixes on the names."
        explanation: "Not correct. The duplicate stops the whole event."
      - id: c
        text: "Nothing. It stops with an error, even for the correct PipelineRuns."
        explanation: "Correct. The error is \"found multiple pipelinerun in .tekton with the same name\"."
      - id: d
        text: "Only the file that changed in the event."
        explanation: "Not correct. Changed files are not used to resolve the clash."
    correct_option: c
    explanation: "Correct. The error is \"found multiple pipelinerun in .tekton with the same name\"."

  - id: ats128-020-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Define custom parameters"
    source_readings:
      - sections/section-020/module-02/course-01-custom-parameters.md
    prompt: "Where do you define a custom parameter that a template reads as `{{ deploy_target }}`?"
    options:
      - id: a
        text: "In the ConfigMap `pipelines-as-code`."
        explanation: "Not correct. That ConfigMap holds installation settings."
      - id: b
        text: "In `spec.params` of the `Repository`."
        explanation: "Correct. The controller fills the value in before it creates the PipelineRun."
      - id: c
        text: "In the `on-event` annotation."
        explanation: "Not correct. That annotation selects events."
      - id: d
        text: "In a Tekton `Pipeline` default."
        explanation: "Not correct. Tekton variables use `$(params.name)`."
    correct_option: b
    explanation: "Correct. The controller fills the value in before it creates the PipelineRun."

  - id: ats128-020-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read an unreplaced variable"
    source_readings:
      - sections/section-020/module-02/course-01-custom-parameters.md
    prompt: "A run starts, but a parameter holds the text `{{ deploy_target }}`. What does that show?"
    options:
      - id: a
        text: "The CRD is missing."
        explanation: "Not correct. The run was created."
      - id: b
        text: "Tekton failed to start the pod."
        explanation: "Not correct. Tekton never sees the braces replaced."
      - id: c
        text: "No custom parameter or built-in variable has that name for this event."
        explanation: "Correct. Variables with no value stay as literal text."
      - id: d
        text: "The webhook secret is wrong."
        explanation: "Not correct. A wrong secret stops the run from being created."
    correct_option: c
    explanation: "Correct. Variables with no value stay as literal text."

  - id: ats128-020-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Limit a parameter with a filter"
    source_readings:
      - sections/section-020/module-02/course-01-custom-parameters.md
    prompt: "Which field gives a custom parameter a value only for certain events or branches?"
    options:
      - id: a
        text: "`when`"
        explanation: "Not correct. That field does not exist."
      - id: b
        text: "`on-event`"
        explanation: "Not correct. That is an annotation of a template."
      - id: c
        text: "`secret_ref`"
        explanation: "Not correct. That reads a value from a Secret."
      - id: d
        text: "`filter`, a CEL expression."
        explanation: "Correct. It can use `pac.event_type` and `pac.target_branch`."
    correct_option: d
    explanation: "Correct. It can use `pac.event_type` and `pac.target_branch`."

  - id: ats128-020-q14
    type: single_choice
    difficulty: beginner
    learning_objective: "Name dynamic variables"
    source_readings:
      - sections/section-020/module-02/course-01-custom-parameters.md
    prompt: "Which variable holds the commit SHA of the event?"
    options:
      - id: a
        text: "`{{ revision }}`"
        explanation: "Correct. It is used to clone and test the right commit."
      - id: b
        text: "`{{ source_branch }}`"
        explanation: "Not correct. That is the branch name."
      - id: c
        text: "`{{ sender }}`"
        explanation: "Not correct. That is the user who caused the event."
      - id: d
        text: "`{{ target_namespace }}`"
        explanation: "Not correct. That is the namespace of the run."
    correct_option: a
    explanation: "Correct. It is used to clone and test the right commit."

  - id: ats128-020-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pass a Secret value to a run"
    source_readings:
      - sections/section-020/module-02/course-02-secrets-and-git-token.md
    prompt: "How does a `Repository` parameter take its value from a Secret?"
    options:
      - id: a
        text: "With `value: secret/name/key`."
        explanation: "Not correct. That is not a reference."
      - id: b
        text: "With `secret_ref`, giving the Secret `name` and `key`."
        explanation: "Correct. The Secret must be in the namespace of the `Repository`."
      - id: c
        text: "With the annotation `secret` on the template."
        explanation: "Not correct. No such annotation exists."
      - id: d
        text: "The controller copies every Secret automatically."
        explanation: "Not correct. Only referenced Secrets are read."
    correct_option: b
    explanation: "Correct. The Secret must be in the namespace of the `Repository`."

  - id: ats128-020-q16
    type: single_choice
    difficulty: advanced
    learning_objective: "Know who can read a secret parameter"
    source_readings:
      - sections/section-020/module-02/course-02-secrets-and-git-token.md
    prompt: "A parameter from `secret_ref` is passed to a run. Who can read the value?"
    options:
      - id: a
        text: "Nobody, because Kubernetes hides it."
        explanation: "Not correct. Parameters are plain fields of the object."
      - id: b
        text: "Only the controller."
        explanation: "Not correct. The run object holds the value."
      - id: c
        text: "Anyone who can read PipelineRuns in the namespace, because the value is stored in the run."
        explanation: "Correct. Mounting the Secret in the step protects it better."
      - id: d
        text: "Only cluster administrators."
        explanation: "Not correct. Namespace readers can see it."
    correct_option: c
    explanation: "Correct. Mounting the Secret in the step protects it better."

  - id: ats128-020-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Clone a private repository"
    source_readings:
      - sections/section-020/module-02/course-02-secrets-and-git-token.md
    prompt: "Which variable names the Secret that holds a provider token for cloning a private repository?"
    options:
      - id: a
        text: "`{{ repo_token }}`"
        explanation: "Not correct. That variable does not exist."
      - id: b
        text: "`{{ webhook_secret }}`"
        explanation: "Not correct. That is the signing secret."
      - id: c
        text: "`{{ sender }}`"
        explanation: "Not correct. That is a user name."
      - id: d
        text: "`{{ git_auth_secret }}`"
        explanation: "Correct. Pass it to a clone step as a workspace."
    correct_option: d
    explanation: "Correct. Pass it to a clone step as a workspace."

  - id: ats128-020-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use a Task from the .tekton folder"
    source_readings:
      - sections/section-020/module-02/course-03-local-and-remote-tasks.md
    prompt: "A template uses `taskRef: {name: print-status}`. Where does Pipelines-as-Code find that Task?"
    options:
      - id: a
        text: "In a `Task` file named `print-status` in the `.tekton` folder, or in a fetched source named by the `task` annotation."
        explanation: "Correct. It embeds the Task before it creates the PipelineRun."
      - id: b
        text: "In any namespace of the cluster."
        explanation: "Not correct. The controller looks in the repository files."
      - id: c
        text: "In the Tekton Dashboard."
        explanation: "Not correct. The Dashboard is not a source."
      - id: d
        text: "In the `Repository` object."
        explanation: "Not correct. The object holds no Tasks."
    correct_option: a
    explanation: "Correct. It embeds the Task before it creates the PipelineRun."

  - id: ats128-020-q19
    type: single_choice
    difficulty: advanced
    learning_objective: "Pin remote Tasks"
    source_readings:
      - sections/section-020/module-02/course-03-local-and-remote-tasks.md
    prompt: "A `task` annotation points at a raw file on a moving branch. What is the risk?"
    options:
      - id: a
        text: "The controller caches it forever."
        explanation: "Not correct. It is fetched again."
      - id: b
        text: "The Task changes when someone pushes to that branch, so your pipeline changes without a review."
        explanation: "Correct. Pin the address to a tag or a commit."
      - id: c
        text: "Tekton refuses remote Tasks."
        explanation: "Not correct. The controller embeds them."
      - id: d
        text: "The Task runs in the wrong namespace."
        explanation: "Not correct. The namespace is not affected."
    correct_option: b
    explanation: "Correct. Pin the address to a tag or a commit."

  - id: ats128-020-q20
    type: single_choice
    difficulty: beginner
    learning_objective: "Resolve a template locally"
    source_readings:
      - sections/section-020/module-02/course-04-resolve-and-author-errors.md
    prompt: "Which command prints the PipelineRun that the controller would build from a template on your machine?"
    options:
      - id: a
        text: "`tkn pipelinerun describe -f pull-request.yaml`"
        explanation: "Not correct. That describes a run in the cluster."
      - id: b
        text: "`tkn pac logs pull-request.yaml`"
        explanation: "Not correct. That prints run logs."
      - id: c
        text: "`tkn pac resolve -f pull-request.yaml -p revision=main --no-secret`"
        explanation: "Correct. It embeds Tasks and fills the variables you give."
      - id: d
        text: "`kubectl explain pull-request.yaml`"
        explanation: "Not correct. That explains API fields."
    correct_option: c
    explanation: "Correct. It embeds Tasks and fills the variables you give."
