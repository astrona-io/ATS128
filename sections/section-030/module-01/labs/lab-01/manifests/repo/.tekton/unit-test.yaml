# The unit-test PipelineRun: Pipelines-as-Code runs it for every pull request into main.
# The values of the parameters below are dynamic variables (source_url and
# revision): Pipelines-as-Code replaces them with the pull request's repository URL and commit SHA.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: unit-test
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  params:
    - name: repo_url
      value: "{{ source_url }}"
    - name: revision
      value: "{{ revision }}"
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
    results:
      - name: commit
        value: $(tasks.checkout-and-test.results.commit)
    tasks:
      - name: checkout-and-test
        params:
          - name: repo_url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
        taskSpec:
          params:
            - name: repo_url
              type: string
            - name: revision
              type: string
          results:
            - name: commit
              description: The commit SHA that was checked out
          steps:
            - name: clone
              image: alpine/git:v2.52.0
              workingDir: /workspace
              script: |
                #!/bin/sh
                set -eu
                git clone --quiet "$(params.repo_url)" source
                cd source
                git checkout --quiet "$(params.revision)"
                git rev-parse HEAD | tr -d '\n' > "$(results.commit.path)"
                echo "Checked out $(params.revision)"
            - name: unit-test
              image: busybox:1.37.0
              workingDir: /workspace/source
              script: |
                #!/bin/sh
                set -eu
                case "$(sh app/status.sh)" in
                  *nominal*) echo "unit tests passed" ;;
                  *) echo "unexpected status line"; exit 1 ;;
                esac
                sleep 20
