# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats128-030
course_id: ATS128
exam_code: TEKTON
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "Pull Request Status, Concurrency And Access Control"
questions:
  - id: ats128-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Read a commit status name"
    source_readings:
      - sections/section-030/module-01/course-01-status-reporting.md
    prompt: "A template named `lint` runs for a pull request. What is the name (context) of its commit status with the default settings?"
    options:
      - id: a
        text: "`lint`"
        explanation: "Not correct. The application name is always the prefix."
      - id: b
        text: "`tekton / lint-x7k2p`"
        explanation: "Not correct. The generated run name is not used in the status."
      - id: c
        text: "`Pipelines as Code CI / lint`"
        explanation: "Correct. The prefix is the `application-name` setting, followed by the template name."
      - id: d
        text: "`Pipelines as Code CI / pull_request`"
        explanation: "Not correct. The status uses the template name, not the event."
    correct_option: c
    explanation: "Correct. The prefix is the `application-name` setting, followed by the template name."

  - id: ats128-030-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Find where Gitea shows results"
    source_readings:
      - sections/section-030/module-01/course-01-status-reporting.md
    prompt: "With Gitea or Forgejo, where does Pipelines-as-Code report a pull request run?"
    options:
      - id: a
        text: "In the Checks tab."
        explanation: "Not correct. Only a GitHub App uses the Checks API."
      - id: b
        text: "Only in the controller log."
        explanation: "Not correct. The result is written back to the provider."
      - id: c
        text: "As an email to the author."
        explanation: "Not correct. Pipelines-as-Code does not send email."
      - id: d
        text: "As a commit status for each template and a comment on the pull request."
        explanation: "Correct. Both are written by Pipelines-as-Code."
    correct_option: d
    explanation: "Correct. Both are written by Pipelines-as-Code."

  - id: ats128-030-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the status history"
    source_readings:
      - sections/section-030/module-01/course-01-status-reporting.md
    prompt: "Gitea keeps every status of a commit. Which line is the current status of `Pipelines as Code CI / lint`?"
    options:
      - id: a
        text: "The newest line with that name, which has the highest `id`."
        explanation: "Correct. Older lines, such as `pending`, stay in the list."
      - id: b
        text: "The first line with that name."
        explanation: "Not correct. The first line is usually the old `pending` status."
      - id: c
        text: "Any line, because they are all the same."
        explanation: "Not correct. The states differ over time."
      - id: d
        text: "The line with the shortest description."
        explanation: "Not correct. The length of the description means nothing."
    correct_option: a
    explanation: "Correct. Older lines, such as `pending`, stay in the list."

  - id: ats128-030-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain who writes which status"
    source_readings:
      - sections/section-030/module-01/course-01-status-reporting.md
    prompt: "Which component writes the `pending` status with the description `CI has Started`, and which writes the final status?"
    options:
      - id: a
        text: "The watcher writes `pending`. The controller writes the final status."
        explanation: "Not correct. The roles are the other way around."
      - id: b
        text: "The controller writes `pending` when it creates the runs. The watcher writes the final status."
        explanation: "Correct. The watcher follows the run until it finishes."
      - id: c
        text: "Gitea writes both, from the webhook delivery."
        explanation: "Not correct. Gitea does not know the run result."
      - id: d
        text: "Tekton Pipelines writes both."
        explanation: "Not correct. Tekton does not talk to the Git provider."
    correct_option: b
    explanation: "Correct. The watcher follows the run until it finishes."

  - id: ats128-030-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Limit parallel runs"
    source_readings:
      - sections/section-030/module-01/course-02-concurrency.md
    prompt: "Which field of the `Repository` limits how many PipelineRuns run at the same time?"
    options:
      - id: a
        text: "`max-keep-runs`"
        explanation: "Not correct. That is an annotation that deletes old runs."
      - id: b
        text: "`pipelinerun_provenance`"
        explanation: "Not correct. That chooses where `.tekton` is read from."
      - id: c
        text: "`concurrency_limit`"
        explanation: "Correct. The smallest value is `1`."
      - id: d
        text: "`cancel-in-progress`"
        explanation: "Not correct. That is an annotation that cancels older runs."
    correct_option: c
    explanation: "Correct. The smallest value is `1`."

  - id: ats128-030-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe the queue states"
    source_readings:
      - sections/section-030/module-01/course-02-concurrency.md
    prompt: "A run is waiting in the queue because of `concurrency_limit`. What does the PipelineRun look like?"
    options:
      - id: a
        text: "The run has failed with the reason `Queued`."
        explanation: "Not correct. A queued run has not started and has not failed."
      - id: b
        text: "The run does not exist yet."
        explanation: "Not correct. The controller creates it as pending."
      - id: c
        text: "The run is `started` but its pods are paused."
        explanation: "Not correct. A pending run has no pods and no start time."
      - id: d
        text: "`spec.status` is `PipelineRunPending` and the label `pipelinesascode.tekton.dev/state` is `queued`."
        explanation: "Correct. The watcher starts it when a slot is free."
    correct_option: d
    explanation: "Correct. The watcher starts it when a slot is free."

  - id: ats128-030-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Apply a limit to existing runs"
    source_readings:
      - sections/section-030/module-01/course-02-concurrency.md
    prompt: "You set `concurrency_limit: 1` while three runs are already running. What happens to them?"
    options:
      - id: a
        text: "Nothing. The limit applies to events that arrive after the change."
        explanation: "Correct. Push a new commit to see the queue."
      - id: b
        text: "Two of them are cancelled at once."
        explanation: "Not correct. Existing runs are not changed."
      - id: c
        text: "All three are paused until one finishes."
        explanation: "Not correct. Existing runs keep running."
      - id: d
        text: "The admission webhook refuses the change."
        explanation: "Not correct. `1` is a valid value. Only `0` is refused."
    correct_option: a
    explanation: "Correct. Push a new commit to see the queue."

  - id: ats128-030-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the cancel-in-progress limits"
    source_readings:
      - sections/section-030/module-01/course-02-concurrency.md
    prompt: "Which statement about `cancel-in-progress` in v0.52.0 is correct?"
    options:
      - id: a
        text: "It must always be used together with `concurrency_limit`."
        explanation: "Not correct. The two do not work together."
      - id: b
        text: "It cannot be used together with `concurrency_limit` on the same repository."
        explanation: "Correct. Choose one of the two."
      - id: c
        text: "It deletes the Tekton Pipelines controller's queue."
        explanation: "Not correct. It cancels older runs of the same template."
      - id: d
        text: "It cancels runs of other repositories too."
        explanation: "Not correct. It works on one template and one pull request or branch."
    correct_option: b
    explanation: "Correct. Choose one of the two."

  - id: ats128-030-q09
    type: single_choice
    difficulty: beginner
    learning_objective: "Know who may run pipelines"
    source_readings:
      - sections/section-030/module-01/course-03-access-control.md
    prompt: "Which sender can run pipelines on a pull request without any approval?"
    options:
      - id: a
        text: "Any user with a Gitea account."
        explanation: "Not correct. Other users wait for approval."
      - id: b
        text: "Only users who commented `/retest` before."
        explanation: "Not correct. `/retest` is not an approval."
      - id: c
        text: "A collaborator with write access."
        explanation: "Correct. Owners, organization members and `OWNERS` entries are allowed too."
      - id: d
        text: "Only the pipelines-as-code-controller."
        explanation: "Not correct. The controller checks senders. It is not one."
    correct_option: c
    explanation: "Correct. Owners, organization members and `OWNERS` entries are allowed too."

  - id: ats128-030-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Approve an outside pull request"
    source_readings:
      - sections/section-030/module-01/course-03-access-control.md
    prompt: "An outside contributor opens a pull request and its commit status is `pending - Pending approval, waiting for an /ok-to-test`. What starts the runs?"
    options:
      - id: a
        text: "The contributor comments `/ok-to-test`."
        explanation: "Not correct. Only an allowed user's comment counts."
      - id: b
        text: "The contributor comments `/retest`."
        explanation: "Not correct. `/retest` reruns templates only for allowed users."
      - id: c
        text: "The watcher is restarted."
        explanation: "Not correct. Restarting does not approve anything."
      - id: d
        text: "An allowed user comments `/ok-to-test` on the pull request."
        explanation: "Correct. The approval covers the current commit only."
    correct_option: d
    explanation: "Correct. The approval covers the current commit only."

  - id: ats128-030-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Use comment commands"
    source_readings:
      - sections/section-030/module-02/course-01-comment-commands.md
    prompt: "A reviewer writes `/retest` on a pull request. Which pipelines run again?"
    options:
      - id: a
        text: "Every pipeline, even those that succeeded."
        explanation: "Not correct. Use `/test <name>` or `/retest <name>` to force one."
      - id: b
        text: "Only the pipelines that failed."
        explanation: "Correct. `/retest <name>` forces one pipeline to run again."
      - id: c
        text: "Only the newest pipeline."
        explanation: "Not correct. Failure decides, not age."
      - id: d
        text: "None. The command only posts a status."
        explanation: "Not correct. It starts runs."
    correct_option: b
    explanation: "Correct. `/retest <name>` forces one pipeline to run again."

  - id: ats128-030-q12
    type: single_choice
    difficulty: beginner
    learning_objective: "Select one pipeline with a comment"
    source_readings:
      - sections/section-030/module-02/course-01-comment-commands.md
    prompt: "Which comment forces only the pipeline `lint` to run, even if it succeeded?"
    options:
      - id: a
        text: "`/lint`"
        explanation: "Not correct. That is not a command."
      - id: b
        text: "`/cancel lint`"
        explanation: "Not correct. That cancels it."
      - id: c
        text: "`/test lint`"
        explanation: "Correct. The name is the `metadata.name` of the template."
      - id: d
        text: "`/ok-to-test lint`"
        explanation: "Not correct. That approves a stranger's pull request."
    correct_option: c
    explanation: "Correct. The name is the `metadata.name` of the template."

  - id: ats128-030-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Approve a pull request from a user without rights"
    source_readings:
      - sections/section-030/module-02/course-01-comment-commands.md
    prompt: "A user with no rights opens a pull request. Nothing runs. Who must write `/ok-to-test` for the runs to start?"
    options:
      - id: a
        text: "The author of the pull request."
        explanation: "Not correct. Only an allowed user can approve."
      - id: b
        text: "Any user who can read the repository."
        explanation: "Not correct. Read access is not enough."
      - id: c
        text: "No one. The controller approves after one minute."
        explanation: "Not correct. There is no timeout."
      - id: d
        text: "An allowed user, such as the owner or a collaborator."
        explanation: "Correct. The author's own comment has no effect."
    correct_option: d
    explanation: "Correct. The author's own comment has no effect."

  - id: ats128-030-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write an on-comment template"
    source_readings:
      - sections/section-030/module-02/course-02-run-from-a-comment.md
    prompt: "Which annotation starts a template when a pull request comment matches a regular expression?"
    options:
      - id: a
        text: "`pipelinesascode.tekton.dev/on-comment`"
        explanation: "Correct. Anchor the expression with `^`."
      - id: b
        text: "`pipelinesascode.tekton.dev/on-event: [comment]`"
        explanation: "Not correct. `comment` is not an event name for this."
      - id: c
        text: "`pipelinesascode.tekton.dev/on-label`"
        explanation: "Not correct. That annotation does not exist."
      - id: d
        text: "`pipelinesascode.tekton.dev/on-text`"
        explanation: "Not correct. That annotation does not exist."
    correct_option: a
    explanation: "Correct. Anchor the expression with `^`."

  - id: ats128-030-q15
    type: single_choice
    difficulty: advanced
    learning_objective: "Handle comment text safely"
    source_readings:
      - sections/section-030/module-02/course-02-run-from-a-comment.md
    prompt: "A template uses `{{ trigger_comment }}`. How should the step read it?"
    options:
      - id: a
        text: "Write `{{ trigger_comment }}` directly into the script."
        explanation: "Not correct. A comment with shell syntax would run as a command."
      - id: b
        text: "Pass it through a parameter into an environment variable and read the variable."
        explanation: "Correct. The comment is user input and must not be written into script text."
      - id: c
        text: "Write it into the image name."
        explanation: "Not correct. That has the same risk."
      - id: d
        text: "Never use it."
        explanation: "Not correct. It is safe through an environment variable."
    correct_option: b
    explanation: "Correct. The comment is user input and must not be written into script text."

  - id: ats128-030-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Configure an incoming webhook"
    source_readings:
      - sections/section-030/module-02/course-03-incoming-webhooks.md
    prompt: "Which `Repository` field configures a webhook that starts runs without a Git event?"
    options:
      - id: a
        text: "`spec.webhook`"
        explanation: "Not correct. That field does not exist."
      - id: b
        text: "`spec.settings.incoming`"
        explanation: "Not correct. It is a top-level `spec` field."
      - id: c
        text: "`spec.incoming`"
        explanation: "Correct. It holds the type, the secret, the targets and the params."
      - id: d
        text: "`spec.git_provider.incoming`"
        explanation: "Not correct. It is not part of `git_provider`."
    correct_option: c
    explanation: "Correct. It holds the type, the secret, the targets and the params."

  - id: ats128-030-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the event type of an incoming call"
    source_readings:
      - sections/section-030/module-02/course-03-incoming-webhooks.md
    prompt: "Which `on-event` value must a template have to answer an incoming webhook?"
    options:
      - id: a
        text: "`[push]`"
        explanation: "Not correct. An incoming call is not a push."
      - id: b
        text: "`[webhook]`"
        explanation: "Not correct. That is not an event name."
      - id: c
        text: "`[pull_request]`"
        explanation: "Not correct. There is no pull request."
      - id: d
        text: "`[incoming]`"
        explanation: "Correct. The run has the event type `incoming`."
    correct_option: d
    explanation: "Correct. The run has the event type `incoming`."

  - id: ats128-030-q18
    type: single_choice
    difficulty: advanced
    learning_objective: "List what a caller can set"
    source_readings:
      - sections/section-030/module-02/course-03-incoming-webhooks.md
    prompt: "The body of an incoming call sets a variable that is not in `incoming[].params`. What happens?"
    options:
      - id: a
        text: "The variable is not used and stays as literal text."
        explanation: "Correct. Only the listed names can be set by the caller."
      - id: b
        text: "The caller overrides it."
        explanation: "Not correct. Unlisted names are ignored."
      - id: c
        text: "The call is retried."
        explanation: "Not correct. The controller does not retry."
      - id: d
        text: "The Repository is changed."
        explanation: "Not correct. A call never edits the object."
    correct_option: a
    explanation: "Correct. Only the listed names can be set by the caller."

  - id: ats128-030-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find why a run did not start"
    source_readings:
      - sections/section-030/module-02/course-04-why-a-run-did-not-start.md
    prompt: "What is the first place to look when a push produces no run?"
    options:
      - id: a
        text: "`max-keep-runs` of the template."
        explanation: "Not correct. It acts after a run exists."
      - id: b
        text: "The webhook on the Git server: is it active, with the right URL and events?"
        explanation: "Correct. Work from the Git server toward the cluster."
      - id: c
        text: "The Tekton Pipelines version."
        explanation: "Not correct. Tekton is not involved before the run exists."
      - id: d
        text: "The node CPU."
        explanation: "Not correct. That affects running, not creation."
    correct_option: b
    explanation: "Correct. Work from the Git server toward the cluster."

  - id: ats128-030-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "Read a queued run"
    source_readings:
      - sections/section-030/module-02/course-04-why-a-run-did-not-start.md
    prompt: "A PipelineRun exists but does not run. `concurrency_limit: 1` is set and another run is going. What is the state?"
    options:
      - id: a
        text: "The run failed."
        explanation: "Not correct. It has not started."
      - id: b
        text: "The webhook was refused."
        explanation: "Not correct. The run was created."
      - id: c
        text: "The run is queued and starts when a slot is free."
        explanation: "Correct. It is not broken."
      - id: d
        text: "The template is invalid."
        explanation: "Not correct. An invalid template creates no run."
    correct_option: c
    explanation: "Correct. It is not broken."
