# Start A Pipeline With An Incoming Webhook
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-128-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tekton-pac"
      description: "Installs the tkn CLI 0.46.2, tkn-pac 0.52.0, Tekton Pipelines v1.17.1, Pipelines-as-Code v0.52.0 and Gitea with the user starfleet and a token"
      type: "file"
      source: "bootstrap/01-install-tekton-pac.sh"
    - name: "ats-128-lab-030-02-setup"
      description: "Seeds starfleet/bridge-app with the pipelines lint, unit-test and release (release runs only for incoming webhooks) and connects it"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The namespaces starfleet and gitea, Gitea and the tester pod"
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-environment"
      description: "Waits until Tekton, Pipelines-as-Code and Gitea are ready"
      type: "file"
      source: "testing/wait-for-environment.sh"
    - name: "reference-solution"
      description: "The fix a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-incoming-config"
      description: "Confirms the Repository bridge-app has an incoming webhook of type webhook-url that targets main and lists the param environment"
      type: "file"
      source: "validation/validate-incoming-config.sh"
    - name: "validate-incoming-secret"
      description: "Confirms the Secret named by the incoming webhook exists with a long enough value that is not written in the Repository"
      type: "file"
      source: "validation/validate-incoming-secret.sh"
    - name: "validate-incoming-run"
      description: "Confirms a release PipelineRun for the event type incoming succeeded with environment staging on the head of main"
      type: "file"
      source: "validation/validate-incoming-run.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
      - alpine/git:v2.52.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
