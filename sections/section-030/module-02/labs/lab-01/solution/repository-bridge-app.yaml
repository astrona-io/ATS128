# The Repository bridge-app with an incoming webhook. The caller must send the
# secret from the Secret bridge-incoming, may target only main, and may set
# the param environment in the request body.
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: bridge-app
  namespace: starfleet
spec:
  url: "http://gitea-http.gitea.svc.cluster.local:3000/starfleet/bridge-app"
  git_provider:
    type: gitea
    url: "http://gitea-http.gitea.svc.cluster.local:3000"
    secret:
      name: gitea-webhook-config
      key: provider.token
    webhook_secret:
      name: gitea-webhook-config
      key: webhook.secret
  incoming:
    - type: webhook-url
      secret:
        name: bridge-incoming
        key: secret
      targets:
        - main
      params:
        - environment
